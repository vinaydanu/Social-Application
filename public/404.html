<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found – ConnectSphere</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found-box {
      max-width: 500px;
      margin: 80px auto;
      text-align: center;
      background: #ffffff;
      padding: 40px 24px;
      border-radius: var(--radius-md);
      box-shadow: var(--card-shadow);
    }
  </style>
</head>
<body>
  <div class="demo-banner">
    <span class="badge">404</span>
    <span>ConnectSphere Demo</span>
  </div>

  <main class="not-found-box">
    <div class="brand-icon" style="margin: 0 auto 16px auto;">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
    </div>
    <h1 style="font-size: 28px; margin-bottom: 8px;">Page Isn't Available</h1>
    <p style="color: var(--text-secondary); margin-bottom: 24px;">The link you followed may be broken, or the page may have been removed.</p>
    <a href="/" class="btn btn-primary" style="display: inline-flex; width: auto; padding: 0 24px; height: 42px; font-size: 15px;">Go to Home Page</a>
  </main>
</body>
</html>
